    <script>
        const cursor = document.querySelector(".cursor-follow");
        let mouseX = 0;
        let mouseY = 0;

        window.addEventListener("mousemove", (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        // animate cursor with trailing delay
        gsap.ticker.add(() => {
            gsap.to(cursor, {
                x: mouseX,
                y: mouseY,
                duration: 0.4, // increase for smoother trailing
                ease: "power3.out"
            });
        });


        window.addEventListener("DOMContentLoaded", () => {
            gsap.to("header", {
                y: 0,
                opacity: 1,
                duration: 1,
                ease: "power3.out"
            });
        });
    </script>
